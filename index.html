<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  color: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}
.container { width: 100%; max-width: 400px; text-align: center; }
.logo {
  font-family: "Billabong", cursive, sans-serif;
  font-size: 48px;
  margin-bottom: 40px;
  background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: bold;
}
.avatar {
  width: 120px; height: 120px;
  border-radius: 50%;
  margin: 0 auto 20px;
  background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
  padding: 3px;
}
.avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #000; }
.username { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.subtitle { font-size: 14px; color: #a8a8a8; margin-bottom: 30px; }
.btn {
  width: 100%; padding: 14px;
  background: #0095f6; border: none; border-radius: 8px;
  color: #fff; font-size: 15px; font-weight: 600;
  cursor: pointer; margin-bottom: 12px;
}
.btn:hover { background: #1877f2; }
.btn-secondary { background: transparent; color: #0095f6; font-size: 14px; }
.btn-secondary:hover { background: #1a1a1a; }
.footer { margin-top: 30px; font-size: 12px; color: #666; }
.loading { display: none; margin-top: 20px; font-size: 14px; color: #a8a8a8; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">Instagram</div>
  <div class="avatar"><img src="img/avatar.jpg" alt="game_uppp"></div>
  <div class="username">game_uppp</div>
  <div class="subtitle">Войдите, чтобы продолжить</div>
  <button class="btn" id="continueBtn">Продолжить как @game_uppp</button>
  <button class="btn btn-secondary">Войти в другой аккаунт</button>
  <div class="loading" id="loading">Загрузка профиля...</div>
  <div class="footer">© 2026 Instagram from Meta</div>
</div>
<script src="js/splash.js"></script>
</body>
</html>
